[project]
name = "zentra-backend"
version = "1.0.0"
description = "Zentra ML API - Health prediction and fitness assistant backend"
requires-python = ">=3.13"

dependencies = [
    # Web Framework
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.27.0",
    "scalar-fastapi==1.0.3",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.1",
    "redis[hiredis]==5.2.1",

    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "bcrypt==4.0.1",

    # Data Validation
    "pydantic==2.10.5",
    "pydantic-settings==2.12.0",
    "email-validator>=2.3.0",

    # Email
    "fastapi-mail==1.4.1",

    # Machine Learning
    "numpy==2.2.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "joblib==1.3.2",

    # Utilities
    "python-dotenv==1.0.0",
    "requests>=2.31.0",

    # RAG - PDF Processing
    "PyPDF2==3.0.1",
    "pypdf==6.6.2",

    # RAG - Vector Database
    "chromadb>=1.3.5",

    # RAG - Embeddings & LLM
    "google-generativeai==0.8.6",

    # RAG - LangChain ecosystem
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-google-genai",
    "langchain-chroma==1.1.0",

    # RAG - LangGraph agent
    "langgraph",
    "langgraph-checkpoint-redis",

    # RAG - Utilities
    "tiktoken==0.12.0",
    "tenacity==9.1.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
