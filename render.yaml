databases:
  - name: zentra-db
    databaseName: zentra
    user: zentra_user
    plan: free

services:
  - type: redis
    name: zentra-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: zentra-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/ml/download_models.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      
      - key: DATABASE_URL
        fromDatabase:
          name: zentra-db
          property: connectionString
      
      - key: REDIS_URL
        fromService:
          name: zentra-redis
          type: redis
          property: connectionString
      
      - key: SECRET_KEY
        generateValue: true
      
      - key: ALGORITHM
        value: HS256
      
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      
      # Email settings - YOU MUST UPDATE THESE
      - key: MAIL_USERNAME
        sync: false  # Set manually in Render dashboard
      
      - key: MAIL_PASSWORD
        sync: false  # Set manually in Render dashboard
      
      - key: MAIL_FROM
        sync: false  # Set manually in Render dashboard
      
      - key: MAIL_PORT
        value: "587"
      
      - key: MAIL_SERVER
        value: smtp.gmail.com
      
      - key: MAIL_FROM_NAME
        value: Zentra
      
      - key: MAIL_STARTTLS
        value: "True"
      
      - key: MAIL_SSL_TLS
        value: "False"
      
      - key: USE_CREDENTIALS
        value: "True"
      
      - key: VALIDATE_CERTS
        value: "True"
      
      # API Keys - YOU MUST UPDATE THESE
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      
      # Frontend URL - UPDATE THIS
      - key: FRONTEND_URL
        sync: false  # Set manually in Render dashboard
